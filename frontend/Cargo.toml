[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "KeyboardEvent",
    "HtmlInputElement",
    "HtmlDivElement",
    "Window",
    "Document",
    "Element",
    "CustomEvent"
] }
wasm-bindgen = "0.2"
